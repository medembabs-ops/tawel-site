<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>body{visibility:hidden}</style>
<title>Checkout — Tawel Style</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body class="bg-ivory text-ink font-body">

<main class="pt-32 pb-28 px-6 md:px-10 min-h-[60vh]">
  <div class="max-w-5xl mx-auto">

    <div id="checkout-view">
      <p class="label text-[11px] text-bordeaux mb-4">Checkout</p>
      <h1 class="font-display text-[32px] md:text-[40px] leading-tight mb-4">Shipping Details</h1>
      <p class="text-[13px] text-ink/60 max-w-[52ch] mb-12">
        Your order is saved, then you'll be taken to Paystack to complete payment securely.
      </p>

      <div class="grid md:grid-cols-[1.3fr_1fr] gap-16">
        <form id="checkout-form" class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="label text-[10px] text-ink/60 block mb-2" for="first-name">First name</label>
              <input required id="first-name" name="first-name" type="text" class="w-full border border-blush focus:border-bordeaux outline-none px-4 py-3 text-[14px] bg-white" />
            </div>
            <div>
              <label class="label text-[10px] text-ink/60 block mb-2" for="last-name">Last name</label>
              <input required id="last-name" name="last-name" type="text" class="w-full border border-blush focus:border-bordeaux outline-none px-4 py-3 text-[14px] bg-white" />
            </div>
          </div>
          <div>
            <label class="label text-[10px] text-ink/60 block mb-2" for="email">Email</label>
            <input required id="email" name="email" type="email" class="w-full border border-blush focus:border-bordeaux outline-none px-4 py-3 text-[14px] bg-white" />
          </div>
          <div>
            <label class="label text-[10px] text-ink/60 block mb-2" for="address">Address</label>
            <input required id="address" name="address" type="text" class="w-full border border-blush focus:border-bordeaux outline-none px-4 py-3 text-[14px] bg-white" />
          </div>
          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="label text-[10px] text-ink/60 block mb-2" for="city">City</label>
              <input required id="city" name="city" type="text" class="w-full border border-blush focus:border-bordeaux outline-none px-4 py-3 text-[14px] bg-white" />
            </div>
            <div>
              <label class="label text-[10px] text-ink/60 block mb-2" for="postcode">Postcode</label>
              <input required id="postcode" name="postcode" type="text" class="w-full border border-blush focus:border-bordeaux outline-none px-4 py-3 text-[14px] bg-white" />
            </div>
            <div>
              <label class="label text-[10px] text-ink/60 block mb-2" for="country">Country</label>
              <input required id="country" name="country" type="text" class="w-full border border-blush focus:border-bordeaux outline-none px-4 py-3 text-[14px] bg-white" />
            </div>
          </div>

          <button type="submit" class="label text-[11px] bg-bordeaux text-ivory px-8 py-4 hover:bg-bordeaux-dark transition-colors w-full disabled:opacity-50">
            Place order
          </button>
          <p id="checkout-error" class="hidden text-[13px] text-bordeaux"></p>
        </form>

        <div>
          <p class="label text-[10px] text-ink/60 mb-4">Order summary</p>
          <div id="summary-items" class="divide-y divide-blush border-y border-blush mb-6"></div>
          <div class="flex justify-between text-[15px]">
            <span class="text-ink/70">Total</span>
            <span id="summary-total" class="font-medium"></span>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/products.js"></script>
<script src="assets/site-content.js"></script>
<script src="assets/main.js"></script>
<script>
  renderFooter();
  renderIconDock({ centered: true });
  renderHeaderDivider();

  (async () => {
    if (await isSiteLocked()) {
      renderLockScreen();
      document.body.style.visibility = 'visible';
      return;
    }

    await loadProducts();

    const lines = cartLines();
    if (lines.length === 0) {
      location.href = 'cart.html';
    }

    const summaryItems = document.getElementById('summary-items');
    lines.forEach((line) => {
      summaryItems.insertAdjacentHTML('beforeend', `
        <div class="flex justify-between py-3 text-[13px]">
          <span class="text-ink/70">${line.product.name} · ${line.size} × ${line.qty}</span>
          <span>${formatPrice(line.product.price * line.qty)}</span>
        </div>
      `);
    });
    document.getElementById('summary-total').textContent = formatPrice(cartSubtotal());

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const errorEl = document.getElementById('checkout-error');
      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Placing order…';

      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const reference = `TS-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const amount = cartSubtotal();

      const order = {
        reference,
        customer_name: `${firstName} ${lastName}`.trim(),
        customer_email: email,
        shipping_address: {
          address: document.getElementById('address').value.trim(),
          city: document.getElementById('city').value.trim(),
          postcode: document.getElementById('postcode').value.trim(),
          country: document.getElementById('country').value.trim(),
        },
        items: lines.map((line) => ({
          id: line.product.id,
          name: line.product.name,
          size: line.size,
          qty: line.qty,
          price: line.product.price,
        })),
        amount,
        payment_status: 'pending',
      };

      const resetButton = () => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Place order';
      };

      const { error: insertError } = await supabaseClient.from('orders').insert(order);
      if (insertError) {
        errorEl.textContent = 'Could not save your order — please try again.';
        errorEl.classList.remove('hidden');
        resetButton();
        return;
      }

      let initRes;
      try {
        initRes = await fetch('/api/paystack/initialize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reference, email, amount }),
        });
      } catch {
        errorEl.textContent = 'Could not reach the payment service — please try again.';
        errorEl.classList.remove('hidden');
        resetButton();
        return;
      }

      const initData = await initRes.json();

      if (!initRes.ok || !initData.authorization_url) {
        errorEl.textContent = initData.error || 'Payments are not connected yet — please check back soon. Your order has been saved.';
        errorEl.classList.remove('hidden');
        resetButton();
        return;
      }

      saveCart([]);
      window.location.href = initData.authorization_url;
    });
    document.body.style.visibility = 'visible';
  })();
</script>
</body>
</html>
